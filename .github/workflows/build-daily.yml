name: Clipping Legislativo GSGA

on:
  schedule:
    # Executa às 11:00 UTC (08:00 Horário de Brasília)
    # 2 = Terça-feira, 5 = Sexta-feira
    - cron: '0 11 * * 2,5'
  workflow_dispatch: # Permite que execute o script manualmente para testar

jobs:
  enviar_clipping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install anthropic

      - name: Executar Script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
        run: python nome_do_seu_script.py
